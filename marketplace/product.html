<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — UYEH TECH Marketplace</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/images/uyehtech-logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #d1d5db; min-height: 100vh; }

:root {
  --nav-primary:      #00ff88;
  --nav-primary-dark: #00c96a;
  --nav-dark:         #07090c;
  --nav-gray:         #8a96a8;
  --nav-gray-light:   #edf2f7;
  --nav-error:        #ff4d4d;
}

/* Push page content below the fixed nav. If your page already sets
   body padding-top, this rule is harmless — the more specific one
   defined later in the page will win. */
body { padding-top: 80px; }

/* ════════════════════════════════════════════════
   NAV CONTAINER + LOGO
   ════════════════════════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.98);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,255,136,0.2);
  padding: 15px 40px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 1000;
  box-shadow: 0 5px 30px rgba(0,255,136,0.1);
  animation: navSlideIn 0.5s ease-out;
}
@keyframes navSlideIn { from{transform:translateY(-100%);opacity:0;} to{transform:translateY(0);opacity:1;} }

nav > a { flex-shrink: 0; }
nav > a img { display: block; transition: all 0.3s ease; }
nav > a:hover img { transform: scale(1.05); filter: brightness(1.2); }

/* ════════════════════════════════════════════════
   NAV LINKS
   ════════════════════════════════════════════════ */
.nav-links { display:flex; list-style:none; gap:5px; align-items:center; margin:0; padding:0; }
.nav-link { display:block; padding:12px 20px; color:#d1d5db; text-decoration:none; font-weight:500; font-size:0.95em; border-radius:8px; transition:all 0.3s; }
.nav-link:hover { color:var(--nav-primary); background:rgba(0,255,136,0.1); }
.nav-link.active { color:var(--nav-primary); position:relative; }
.nav-link.active::after { content:''; position:absolute; bottom:5px; left:20px; right:20px; height:2px; background:var(--nav-primary); }

.nav-actions { display:flex; align-items:center; gap:20px; }

/* ════════════════════════════════════════════════
   DROPDOWN (Marketplace / Creators' Hub, etc.)
   ════════════════════════════════════════════════ */
.nav-item--dropdown { position: relative; }

.nav-link--dropdown {
  background: none; border: none; cursor: pointer;
  font-family: 'Montserrat', sans-serif; font-size: 0.95em;
  display: flex; align-items: center; gap: 5px;
  padding: 12px 20px; color: #d1d5db; font-weight: 500;
  border-radius: 8px; transition: all 0.3s ease; white-space: nowrap;
}
.nav-link--dropdown:hover,
.nav-item--dropdown.open .nav-link--dropdown {
  color: var(--nav-primary);
  background: rgba(0, 255, 136, 0.1);
}

.nav-chevron { transition: transform 0.25s ease; flex-shrink: 0; color: currentColor; opacity: 0.7; }
.nav-item--dropdown.open .nav-chevron { transform: rotate(180deg); opacity: 1; }

.nav-dropdown {
  position: absolute; top: calc(100% + 8px); left: 50%;
  transform: translateX(-50%) translateY(-6px);
  min-width: 260px;
  background: rgba(10, 10, 10, 0.98);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 14px; padding: 8px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 136, 0.05);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  z-index: 1100;
}
.nav-dropdown::before {
  content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--nav-primary), transparent);
  border-radius: 2px;
}
.nav-item--dropdown.open .nav-dropdown {
  opacity: 1; visibility: visible; pointer-events: all;
  transform: translateX(-50%) translateY(0);
}

.nav-dropdown__item {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 12px; border-radius: 9px;
  text-decoration: none; color: inherit;
  transition: background 0.2s ease; cursor: pointer;
}
.nav-dropdown__item:hover { background: rgba(0, 255, 136, 0.08); }
.nav-dropdown__icon {
  font-size: 18px; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 255, 136, 0.07);
  border: 1px solid rgba(0, 255, 136, 0.15);
  border-radius: 8px; flex-shrink: 0;
}
.nav-dropdown__label { display: block; color: #ffffff; font-size: 0.88rem; font-weight: 600; margin-bottom: 2px; font-family: 'Montserrat', sans-serif; }
.nav-dropdown__desc  { display: block; color: rgba(255, 255, 255, 0.4); font-size: 0.75rem; font-family: 'Montserrat', sans-serif; font-weight: 400; }
.nav-dropdown__divider { border: none; border-top: 1px solid rgba(0, 255, 136, 0.1); margin: 6px 12px; }

/* ════════════════════════════════════════════════
   CART BUTTON
   ════════════════════════════════════════════════ */
.cart-btn {
  position:relative; background:rgba(0,255,136,0.1);
  border:1px solid rgba(0,255,136,0.3); padding:12px 20px;
  border-radius:12px; color:var(--nav-primary); cursor:pointer;
  font-weight:600; transition:all 0.3s; display:flex; align-items:center;
  gap:8px; font-family:'Montserrat',sans-serif;
}
.cart-btn:hover { background:rgba(0,255,136,0.2); transform:translateY(-2px); box-shadow:0 5px 20px rgba(0,255,136,0.3); }
.cart-count {
  position:absolute; top:-8px; right:-8px;
  background:linear-gradient(135deg,#ff4444,#ff6666); color:white;
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.75rem; font-weight:700; box-shadow:0 2px 10px rgba(255,68,68,0.4);
}

/* ════════════════════════════════════════════════
   AUTH: guest buttons vs. logged-in user dropdown
   ════════════════════════════════════════════════ */
.auth-buttons { display:flex; gap:12px; }
.btn-login, .btn-signup { padding:12px 25px; border-radius:12px; font-weight:600; text-decoration:none; transition:all 0.3s; font-family:'Montserrat',sans-serif; }
.btn-login  { background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3); color:var(--nav-primary); }
.btn-login:hover { background:rgba(0,255,136,0.2); transform:translateY(-2px); }
.btn-signup { background:linear-gradient(135deg,var(--nav-primary-dark),var(--nav-primary)); color:white; border:none; }
.btn-signup:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(0,255,136,0.4); }

.user-dropdown { position:relative; }
.user-avatar-btn {
  display:flex; align-items:center; gap:10px;
  background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3);
  padding:8px 15px; border-radius:12px; color:var(--nav-primary); cursor:pointer;
  font-weight:600; transition:all 0.3s; font-family:'Montserrat',sans-serif;
}
.user-avatar-btn:hover { background:rgba(0,255,136,0.2); transform:translateY(-2px); }
.user-avatar-btn img { width:35px; height:35px; border-radius:50%; border:2px solid var(--nav-primary); }
.dropdown-arrow { font-size:0.7rem; transition:transform 0.3s; }
.user-dropdown.active .dropdown-arrow { transform:rotate(180deg); }

.user-menu {
  position:absolute; top:calc(100% + 10px); right:0;
  background:rgba(15,15,15,0.98); border:1px solid rgba(0,255,136,0.3);
  border-radius:15px; width:280px; padding:10px;
  display:none; flex-direction:column; gap:5px;
  box-shadow:0 10px 40px rgba(0,255,136,0.2); backdrop-filter:blur(20px);
  animation:navSlideDown 0.3s ease;
}
.user-menu.active { display:flex; }
@keyframes navSlideDown { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }

.user-menu-header { display:flex; align-items:center; gap:12px; padding:15px; background:rgba(0,255,136,0.05); border-radius:12px; margin-bottom:5px; }
.user-menu-header img { width:50px; height:50px; border-radius:50%; border:2px solid var(--nav-primary); }
.menu-user-name  { font-weight:700; color:var(--nav-primary); font-size:1rem; }
.menu-user-email { font-size:0.85rem; color:var(--nav-gray); }
.user-menu-divider { height:1px; background:rgba(0,255,136,0.2); margin:5px 0; }
.user-menu-item {
  display:flex; align-items:center; gap:12px; padding:12px 15px;
  color:var(--nav-gray-light); text-decoration:none; border-radius:10px;
  transition:all 0.3s; font-weight:500; cursor:pointer; border:none;
  background:transparent; width:100%; text-align:left; font-family:'Montserrat',sans-serif;
}
.user-menu-item:hover { background:rgba(0,255,136,0.1); color:var(--nav-primary); transform:translateX(5px); }
.user-menu-item i { font-size:1.1rem; width:20px; }
.logout-item { color:var(--nav-error); }
.logout-item:hover { background:rgba(255,68,68,0.1); color:var(--nav-error); }

/* ════════════════════════════════════════════════
   MOBILE HAMBURGER
   ════════════════════════════════════════════════ */
.menu-toggle { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:5px; flex-shrink:0; }
.menu-toggle span { width:28px; height:3px; background:var(--nav-primary); border-radius:3px; transition:all 0.3s ease; }
.menu-toggle:hover span { background:var(--nav-primary-dark); }
.menu-toggle.active span:nth-child(1) { transform:rotate(45deg) translate(8px,8px); }
.menu-toggle.active span:nth-child(2) { opacity:0; }
.menu-toggle.active span:nth-child(3) { transform:rotate(-45deg) translate(7px,-7px); }

/* ════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════ */
@media (max-width: 968px) {
  nav { padding:15px 25px; }
  body { padding-top: 70px; }
  .nav-links {
    position:fixed; top:70px; left:-100%; flex-direction:column;
    background:rgba(10,10,10,0.98); backdrop-filter:blur(20px);
    width:100%; height:calc(100vh - 70px); padding:40px 30px; gap:0;
    transition:left 0.3s ease; border-top:1px solid rgba(0,255,136,0.2);
    overflow-y:auto;
  }
  .nav-links.active { left:0; }
  .nav-links li { width:100%; border-bottom:1px solid rgba(0,255,136,0.1); }
  .nav-link { width:100%; padding:18px 0; font-size:1.1em; }
  .menu-toggle { display:flex; order:3; }

  .nav-link--dropdown { width: 100%; padding: 18px 0; font-size: 1.1em; justify-content: space-between; border-radius: 0; }
  .nav-item--dropdown { position: static; width: 100%; }
  .nav-dropdown {
    position: static; transform: none !important; min-width: 100%;
    background: rgba(0, 255, 136, 0.04); border: none;
    border-left: 2px solid rgba(0, 255, 136, 0.3); border-radius: 0;
    box-shadow: none; padding: 4px 0 4px 16px; margin-bottom: 4px;
    backdrop-filter: none; max-height: 0; overflow: hidden;
    opacity: 1; visibility: visible; pointer-events: none;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }
  .nav-dropdown::before { display: none; }
  .nav-item--dropdown.open .nav-dropdown { max-height: 400px; pointer-events: all; padding: 8px 0 8px 16px; }
  .nav-dropdown__item { padding: 10px 8px; border-radius: 6px; }
  .nav-dropdown__icon { width: 30px; height: 30px; font-size: 15px; }
  .nav-dropdown__label { font-size: 0.92rem; }
  .nav-dropdown__desc  { font-size: 0.78rem; }
}
@media (max-width: 600px) {
  nav { padding:15px 20px; }
  body { padding-top:65px; }
  .nav-actions { gap:10px; }
  .cart-text { display:none; }
  .btn-login, .btn-signup { padding:10px 18px; font-size:0.9rem; }
  .user-avatar-btn span:not(.dropdown-arrow) { display:none; }
  .nav-links { top:65px; height:calc(100vh - 65px); padding:30px 20px; }
}
  
    .pd-wrap { max-width: 1100px; margin: 0 auto; padding: 110px 24px 80px; }

    .pd-breadcrumb { font-size: .82rem; color: rgba(255,255,255,.4); margin-bottom: 28px; }
    .pd-breadcrumb a { color: #00ff88; text-decoration: none; }

    .pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }

    }
    .pd-title {
      font-family: 'Playfair Display', serif; font-size: 2em; color: #fff;
      font-weight: 900; line-height: 1.2; margin-bottom: 14px;
    }

    .pd-store-link {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      color: rgba(255,255,255,.6); font-size: .85rem; margin-bottom: 20px;

      border-radius: 10px; width: fit-content; transition: border-color .2s, color .2s;
    }

    .pd-desc { font-size: .92rem; line-height: 1.8; color: rgba(255,255,255,.65); margin-bottom: 28px; white-space: pre-line; }

    .pd-features { list-style: none; margin-bottom: 28px; display: flex; flex-direction: column; gap: 10px; }
    .pd-features li { display: flex; align-items: flex-start; gap: 10px; font-size: .85rem; color: rgba(255,255,255,.6); }
    .pd-features li::before { content: '✓'; color: #00ff88; font-weight: 700; flex-shrink: 0; }

    .pd-buy-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #00ff88, #00c96a); color: #0a0a0a;
      font-weight: 800; font-size: 1rem; padding: 16px 28px; border: none;
      border-radius: 12px; cursor: pointer; width: 100%; transition: box-shadow .2s, transform .2s;
    }
    .pd-buy-btn:hover { box-shadow: 0 8px 30px rgba(0,255,136,.35); transform: translateY(-2px); }
    .pd-buy-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    .pd-actions { display: flex; gap: 12px; }
    .pd-actions .pd-buy-btn { flex: 1; }

    .pd-cart-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: rgba(0,255,136,.06); color: #00ff88;
      font-weight: 700; font-size: 1rem; padding: 16px 24px;
      border: 1px solid rgba(0,255,136,.3); border-radius: 12px; cursor: pointer;
      flex: 1; transition: background .2s, border-color .2s;
    }
    .pd-cart-btn:hover { background: rgba(0,255,136,.12); border-color: rgba(0,255,136,.5); }
    .pd-cart-btn:disabled { opacity: .5; cursor: not-allowed; }

    .pd-trust {
      display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap;
      font-size: .78rem; color: rgba(255,255,255,.4);
    }
    .pd-trust span { display: flex; align-items: center; gap: 6px; }
    .pd-trust i { color: #00ff88; }

    .pd-toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
      background: #111; border: 1px solid rgba(0,255,136,.3); color: #fff;
      font-size: .85rem; font-weight: 600; padding: 12px 22px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
      z-index: 9999; box-shadow: 0 12px 30px rgba(0,0,0,.5);
    }
    .pd-toast--show { opacity: 1; transform: translate(-50%, 0); }

    .pd-meta-row {
      display: flex; gap: 20px; margin-top: 20px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.06); font-size: .78rem; color: rgba(255,255,255,.4);
    }

    .pd-state { text-align: center; padding: 100px 20px; color: rgba(255,255,255,.4); }
    .pd-state i { font-size: 2.5rem; opacity: .3; display: block; margin-bottom: 14px; }


</style>
</head>

    const API_URL = 'https://uyehtechbackend.onrender.com';
    let currencySymbol = '$';
    let currencyRate = 1;
    let currentProduct = null; // set in renderProduct() — Buy Now / Add to Cart read from this

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    async function fetchUserCurrency() {
      const token = localStorage.getItem('token');
      if (!token) return;
      try {
        const res = await fetch(`${API_URL}/api/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          currencySymbol = data.symbol || '$';
          currencyRate = data.rate || 1;
        }
      } catch (_) { /* keep $/1:1 fallback */ }
    }

    function getProductId() {
      // Supports both /marketplace/product/:id (clean route) and
      // /marketplace/product.html?id=... (direct/fallback access)
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const fromPath = pathParts[pathParts.length - 1];
      const fromQuery = new URLSearchParams(window.location.search).get('id');
      if (fromQuery) return fromQuery;
      if (fromPath && fromPath !== 'product' && fromPath !== 'product.html') return fromPath;
      return null;
    }

    async function loadProduct() {
      const id = getProductId();
      const content = document.getElementById('pdContent');

      if (!id) {
        content.innerHTML = `<div class="pd-state"><i class="fas fa-exclamation-circle"></i>No product specified.</div>`;
        return;
      }

      await fetchUserCurrency();

      try {
        const res = await fetch(`${API_URL}/api/products/${encodeURIComponent(id)}`);
        const data = await res.json();

        if (!data.success || !data.product) {
          content.innerHTML = `<div class="pd-state"><i class="fas fa-box-open"></i>This product could not be found. It may have been removed.</div>`;
          return;
        }

        renderProduct(data.product);
      } catch (e) {
        content.innerHTML = `<div class="pd-state"><i class="fas fa-wifi"></i>Could not load this product. Please try again.</div>`;
      }
    }

    function renderProduct(p) {
      const content = document.getElementById('pdContent');
      currentProduct = p; // needed by buyNow()/addToCart() below

      document.title = `${p.title || 'Product'} — UYEH TECH Marketplace`;
      document.getElementById('breadcrumbTitle').textContent = p.title || '';
      if (p.storeName) {
        document.getElementById('breadcrumbSep').textContent = '›';
        document.getElementById('breadcrumbStore').innerHTML =
          `› <a href="/marketplace/${encodeURIComponent(p.storeSlug)}/">${escapeHtml(p.storeName)}</a>`;
      }

      // displayPrice comes pre-converted from the server when a real
      // currency was detected; falls back to client-side conversion
      // using fetchUserCurrency's rate otherwise — same pattern used
      // across the rest of the marketplace.
      const dp = p.displayPrice;
      const rawPrice = dp ? dp.converted : (p.price || 0) * currencyRate;
      const symbol = dp ? dp.symbol : currencySymbol;
      const priceText = `${symbol}${Number(rawPrice).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;

      const hasCompare = p.comparePrice && p.comparePrice > p.price;
      const compareText = hasCompare
        ? `${symbol}${Number((dp ? p.comparePrice * (dp.converted / p.price) : p.comparePrice * currencyRate)).toLocaleString(undefined, { maximumFractionDigits: 2 })}`
        : '';

      const type = (p.productType || p.category || 'Product').replace(/\b\w/g, c => c.toUpperCase());
      const img = p.image || (p.images && p.images[0]) || '';

      const storeLinkHtml = p.storeSlug ? `
        <a href="/marketplace/${encodeURIComponent(p.storeSlug)}/" class="pd-store-link">
          ${p.storePic ? `<img src="${escapeHtml(p.storePic)}" alt="">` : '🏪'}
          <span>Sold by <strong style="color:#fff;">${escapeHtml(p.storeName || 'Creator')}</strong></span>
        </a>` : '';

      const featuresHtml = (p.features && p.features.length)
        ? `<ul class="pd-features">${p.features.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>`
        : '';

      content.innerHTML = `
        <div class="pd-grid">
          <div class="pd-media">
            ${img
              ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(p.title || '')}" onerror="this.parentElement.innerHTML='<span class=\\'pd-media-fallback\\'>📦</span>'">`
              : `<span class="pd-media-fallback">📦</span>`}
          </div>
          <div>
            <div class="pd-type">${escapeHtml(type)}</div>
            <h1 class="pd-title">${escapeHtml(p.title || 'Untitled product')}</h1>
            ${storeLinkHtml}
            <div class="pd-price-row">
              <span class="pd-price">${priceText}</span>
              ${hasCompare ? `<span class="pd-compare">${compareText}</span>` : ''}
            </div>
            <p class="pd-desc">${escapeHtml(p.description || 'No description provided.')}</p>
            ${featuresHtml}
            <div class="pd-actions">
              <button class="pd-buy-btn" onclick="buyNow('${p._id}')">
                <i class="fas fa-bolt"></i> Buy Now
              </button>
              <button class="pd-cart-btn" onclick="addToCart('${p._id}')">
                <i class="fas fa-cart-plus"></i> Add to Cart
              </button>
            </div>
            <div class="pd-trust">
              <span><i class="fas fa-lock"></i> Secure checkout</span>
              <span><i class="fas fa-bolt"></i> Instant delivery</span>
            </div>
            <div class="pd-meta-row">
              ${p.fileSize ? `<span><i class="fas fa-file"></i> ${escapeHtml(p.fileSize)}</span>` : ''}
              ${p.version ? `<span><i class="fas fa-code-branch"></i> v${escapeHtml(p.version)}</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    // ── Cart helpers — 'uyehtech_cart' is the exact key checkout.html reads ──
    function getCart() {
      try { return JSON.parse(localStorage.getItem('uyehtech_cart') || '[]'); }
      catch (_) { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem('uyehtech_cart', JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      const el = document.getElementById('cartCount');
      if (el) el.textContent = getCart().length;
    }

    // Shape matches exactly what checkout.html's displayOrderSummary() /
    // calculateTotals() read: title, price (raw USD), category, icon,
    // displayPrice{symbol,converted}. _id/productId included for order
    // fulfillment on the backend.
    function buildCartItem(p) {
      return {
        _id: p._id,
        productId: p._id,
        title: p.title || 'Untitled product',
        price: p.price || 0,
        category: p.productType || p.category || 'Digital Product',
        icon: p.icon || '📦',
        image: p.image || (p.images && p.images[0]) || '',
        displayPrice: p.displayPrice || null
      };
    }

    function showToast(msg) {
      let t = document.getElementById('pdToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'pdToast';
        t.className = 'pd-toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.add('pd-toast--show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('pd-toast--show'), 2200);
    }

    function buyNow(productId) {
      const token = localStorage.getItem('token');
      if (!token) {
        // Preserve intent through login — same pattern as the rest of the marketplace
        localStorage.setItem('pendingCheckoutProduct', productId);
        window.location.href = `/marketplace/login?redirect=${encodeURIComponent(window.location.pathname)}`;
        return;
      }
      if (!currentProduct) return;
      // Buy Now = focused single-item checkout, not merged with whatever
      // else may already be sitting in the cart.
      saveCart([buildCartItem(currentProduct)]);
      window.location.href = '/marketplace/checkout';
    }

    function addToCart(productId) {
      if (!currentProduct) return;
      const cart = getCart();
      if (cart.some(item => (item._id || item.productId) === productId)) {
        showToast('Already in your cart');
        return;
      }
      cart.push(buildCartItem(currentProduct));
      saveCart(cart);
      showToast('Added to cart ✓');
    }

    updateCartCount();
    loadProduct();
  </script>
<script>
  (function () {
  'use strict';

  /* ═══════════════════════════════════════════
     PART 1: Mobile menu + dropdown toggles
     ═══════════════════════════════════════════ */
  var menuToggle = document.getElementById('menuToggle');
  var navLinks   = document.getElementById('navLinks');
  var dropItems  = document.querySelectorAll('.nav-item--dropdown');

  function closeAllDropdowns() {
    dropItems.forEach(function (item) {
      item.classList.remove('open');
      var btn = item.querySelector('.nav-link--dropdown');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });
  }

  function toggleDropdown(item) {
    var isOpen = item.classList.contains('open');
    var btn    = item.querySelector('.nav-link--dropdown');
    closeAllDropdowns();
    if (!isOpen) {
      item.classList.add('open');
      if (btn) btn.setAttribute('aria-expanded', 'true');
    }
  }

  dropItems.forEach(function (item) {
    var btn = item.querySelector('.nav-link--dropdown');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleDropdown(item);
    });
  });

  document.addEventListener('click', function (e) {
    var insideNav = navLinks && navLinks.contains(e.target);
    if (!insideNav) closeAllDropdowns();

    if (navLinks && menuToggle) {
      if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeAllDropdowns();
      if (menuToggle) menuToggle.classList.remove('active');
      if (navLinks)   navLinks.classList.remove('active');
    }
  });

  document.querySelectorAll('.nav-dropdown__item').forEach(function (link) {
    link.addEventListener('click', function () {
      closeAllDropdowns();
      if (menuToggle) menuToggle.classList.remove('active');
      if (navLinks)   navLinks.classList.remove('active');
    });
  });

  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      this.classList.toggle('active');
      navLinks.classList.toggle('active');
      if (!navLinks.classList.contains('active')) closeAllDropdowns();
    });
  }

  document.querySelectorAll('.nav-links .nav-link:not(.nav-link--dropdown)').forEach(function (link) {
    link.addEventListener('click', function () {
      if (menuToggle) menuToggle.classList.remove('active');
      if (navLinks)   navLinks.classList.remove('active');
      closeAllDropdowns();
    });
  });

  /* ═══════════════════════════════════════════
     PART 2: Auth state — guest buttons vs user dropdown

     currentUser lives on `window` — a real global, not scoped to this
     IIFE — so every page can read `window.currentUser` directly instead
     of each page maintaining its own separate copy that never gets set.
     This is the fix for two bugs: pages whose own currentUser never got
     assigned (login redirect loops), and this function's name previously
     being declared again by page-level scripts and silently overwriting
     one or the other depending on script load order.
     ═══════════════════════════════════════════ */
  var API_URL = window.API_URL || 'https://uyehtechbackend.onrender.com';
  window.currentUser = window.currentUser || null;

  function checkAuthentication() {
    var token = localStorage.getItem('token');
    var user  = localStorage.getItem('user');
    if (!token || !user) { showGuestButtons(); _announceAuthReady(); return; }

    try {
      window.currentUser = JSON.parse(user);
      showUserDropdown(window.currentUser);
      _announceAuthReady();

      // Background validation — route is /api/profile (no "/user" segment).
      fetch(API_URL + '/api/profile', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.currentUser = null;
          showGuestButtons();
          return null;
        }
        // Any other non-OK status (404, 500, rate limit, offline) is a
        // server-side problem, not proof the token is bad. Don't log out.
        return r.ok ? r.json() : null;
      })
      .then(function (data) {
        if (data && data.success && data.user) {
          window.currentUser = data.user;
          localStorage.setItem('user', JSON.stringify(data.user));
          showUserDropdown(data.user);
        }
      })
      .catch(function () {}); // network error — keep showing cached state
    } catch (e) {
      // Stored 'user' was corrupted/unparseable — self-heal instead of
      // getting silently stuck showing "guest" forever on every future load.
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.currentUser = null;
      showGuestButtons();
      _announceAuthReady();
    }
  }

  // Lets any page know the initial auth check has resolved, without having
  // to guess script load order or duplicate this logic themselves.
  function _announceAuthReady() {
    window.dispatchEvent(new CustomEvent('uyeh-auth-ready', { detail: window.currentUser }));
  }

  function showUserDropdown(user) {
    var guestEl = document.getElementById('guestButtons');
    var userEl  = document.getElementById('userDropdown');
    if (!guestEl || !userEl) return; // page has no auth widget — skip silently

    guestEl.style.display = 'none';
    userEl.style.display  = 'block';

    var name   = user.name || user.fullName || 'User';
    var email  = user.email || '';
    var avatar = user.profilePic || user.profileImage || user.avatar ||
      ('https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=00ff88&color=0a0a0a');

    function set(id, val, attr) {
      var el = document.getElementById(id);
      if (!el) return;
      if (attr) { el[attr] = val; } else { el.textContent = val; }
    }
    set('userAvatar', avatar, 'src');
    set('userName', name.split(' ')[0]);
    set('menuAvatar', avatar, 'src');
    set('menuUserName', name);
    set('menuUserEmail', email);
  }

  function showGuestButtons() {
    var guestEl = document.getElementById('guestButtons');
    var userEl  = document.getElementById('userDropdown');
    if (!guestEl || !userEl) return;
    guestEl.style.display = 'flex';
    userEl.style.display  = 'none';
  }

  function toggleUserMenu() {
    var menu = document.getElementById('userMenu');
    var drop = document.getElementById('userDropdown');
    if (menu) menu.classList.toggle('active');
    if (drop) drop.classList.toggle('active');
  }

  function handleLogout() {
    if (confirm('Are you sure you want to logout?')) {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.currentUser = null;
      showGuestButtons();
      if (typeof showNotification === 'function') {
        showNotification('👋 Logged out successfully');
      }
      setTimeout(function () { window.location.reload(); }, 1000);
    }
  }

  // Close the user menu when clicking outside it
  document.addEventListener('click', function (e) {
    var dropdown = document.getElementById('userDropdown');
    if (dropdown && !dropdown.contains(e.target)) {
      var menu = document.getElementById('userMenu');
      if (menu) menu.classList.remove('active');
      dropdown.classList.remove('active');
    }
  });

  // Expose functions the navbar's inline onclick="" handlers call
  window.toggleUserMenu      = toggleUserMenu;
  window.handleLogout        = handleLogout;
  window.checkAuthentication = checkAuthentication;

  // Run auth check automatically — no per-page call needed
  checkAuthentication();

}());
</script>
